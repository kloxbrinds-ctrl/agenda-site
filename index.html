<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app"></main>
<script src="/shared.js"></script>
<script>
document.title = CONFIG.NAME + " | Agendamento";
const S = Store.load();
const cal = { y: new Date().getFullYear(), m: new Date().getMonth() };
let sel = null, slot = null;
const app = document.getElementById("app");

// Dia clicável: de hoje em diante, com atendimento e não bloqueado pela admin.
// Hoje continua clicável: só os horários que já passaram ficam desativados.
function dayInfo(k) {
  const ok = k >= iso(new Date()) && allSlots(S, k).length > 0 && !S.blockedDays.includes(k);
  return { disabled: !ok };
}

function render() {
  let h = `<section class="hero"><h1>${CONFIG.NAME}</h1><p>Escolha o dia e o horário que ficam melhores para você.</p></section>`;
  h += `<section class="box">${calendarHTML(cal, sel, dayInfo)}</section>`;
  if (sel) {
    const slots = allSlots(S, sel);
    const anyFree = slots.some(s => slotState(S, sel, s) === "free");
    h += `<section class="box"><h2>${fdate(sel)}</h2>`;
    if (!anyFree) h += `<p class="mut" style="margin-bottom:12px">Não há horários disponíveis neste dia. Escolha outra data.</p>`;
    h += `<div class="chips">` + slots.map(s =>
      `<button class="chip ${s === slot ? "on" : ""}" ${slotState(S, sel, s) !== "free" ? "disabled" : ""} data-a="slot" data-v="${s}">${s}</button>`
    ).join("") + `</div>`;
    if (slot) {
      h += `<div class="form"><input id="nome" placeholder="Seu nome" autocomplete="name"><input id="tel" placeholder="Seu WhatsApp (opcional)" inputmode="tel" autocomplete="tel"><p id="err" class="err"></p><button class="btn" data-a="send">Solicitar ${slot} pelo WhatsApp</button><p class="mut">O horário fica reservado após a confirmação do pagamento.</p></div>`;
    }
    h += `</section>`;
  }
  app.innerHTML = h;
}

function send() {
  const nome = document.getElementById("nome").value.trim();
  const tel = document.getElementById("tel").value.trim();
  if (!nome) { document.getElementById("err").textContent = "Informe seu nome."; return; }
  const [y, m, d] = sel.split("-");
  const msg = `Olá! Sou ${nome}${tel ? " (" + tel + ")" : ""} e gostaria de agendar para ${d}/${m}/${y} às ${slot}.`;
  window.open(`https://wa.me/${CONFIG.WHATS}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "prev") shiftMonth(cal, -1);
  else if (a === "next") shiftMonth(cal, 1);
  else if (a === "day") { sel = b.dataset.k; slot = null; }
  else if (a === "slot") slot = b.dataset.v;
  else if (a === "send") { send(); return; }
  render();
});
render();
</script>
</body>
</html>
